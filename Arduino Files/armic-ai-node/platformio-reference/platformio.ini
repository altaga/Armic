; ARMIC AI Node — reference PlatformIO env (M5Stack Core2)
; Copy this folder to your own PlatformIO project or build in-place after adding lib/ + secrets.h

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
upload_speed = 921600

lib_deps =
    m5stack/M5Core2@^0.1.7

build_flags =
    -DCORE_DEBUG_LEVEL=0
