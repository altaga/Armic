id: armic
name: Armic Arm Control
variables:
  - name: ARMIC_DRY_RUN_DEFAULT
    description: "Start with motors gated (movement lab). true/false — default true, so a fresh deploy cannot move hardware unexpectedly."
  - name: ARMIC_PARK_ON_START
    description: "Send the arm to the stable home pose (90/90/95/90, claw open) when the app starts. true/false — default true."
  - name: ARMIC_PAYLOAD_KG_DEFAULT
    description: "Carried mass in kg applied at startup, used for torque derating. Clamped to 0..0.5 by the firmware. Default 0."
  - name: ARMIC_PCA9685_ADDR
    description: "I2C address of the servo driver, used for the startup health check. Accepts 0x40 or decimal. Default 0x40."
  - name: ARMIC_LOG_STATE
    description: "Log every telemetry frame as a STATE line (20 Hz — noisy, for debugging only). true/false — default false."
